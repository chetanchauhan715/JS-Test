<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Practice Project-2</title>
</head>
<body>
    <h1 id="head">BMI Calculator</h1>

    <div class="shape">
        <label class="lb">Enter your Height <input type="text" id="height"></label>
        <label class="lb">Enter your weight <input type="text" id="weight"></label>
        <button id="cl">Calculate</button> 
       <div id="result"></div>
       
        
    </div>

    <div class="info" >
        <span id="index">BMI Index</span>
        <p>Under bmi : Less than18.2</p>
        <p>Healthy bmi : 18.2 - 24.5</p>
        <p>over bmi : More than  24.5</p>
        

    </div>

    <script src="script.js" ></script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Quiz-Game</title>
</head>
<body>

    <div class="question-container">
        <h1 id="question-num">Question Number : <span id="number"></span> </h1>
       <p id="question-description">Lorem ipsum dolor sit amet consectetur adipisicing elit. Quod, reprehenderit omnis! Laudantium, consequatur sed sapiente aliquam nostrum vero consequuntur aut ullam. Itaque similique aut sed culpa sapiente aperiam doloremque quo.
        </p>
    </div>

    <div class="option-container">
        <button class="buttons">option1</button>
        <button class="buttons">option2</button>
        <button class="buttons">option3</button>
        <button class="buttons">option4</button>
    </div>

    <div class="result-container">
        <p class="para">Timer: <span id="timer"></span></p>
        <p class="para">Result:<span id="result"></span></p>
        <p class="para">Remaining Attemps:<span id="attemps"></span></p>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
